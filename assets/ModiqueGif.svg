<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="300"
  viewBox="0 0 900 300"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Modique loading animation</title>
  <desc id="desc">A glowing Modique mark is drawn in a continuous loop.</desc>
  <style>
    :root {
      --ink: #0a0a0c;
      --trace: rgba(255, 255, 255, 0.12);
      --neon: #f8fafc;
    }
    .base-trace,
    .neon-trace {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .base-trace {
      stroke: var(--trace);
      stroke-width: 9;
    }
    .neon-trace {
      stroke: var(--neon);
      stroke-width: 7;
      stroke-dasharray: 20 80;
      animation: draw 3.2s linear infinite;
      filter: url(#neon-glow);
    }
    .neon-trace--delayed {
      animation-delay: -1.6s;
    }
    .ambient-glow {
      animation: breathe 3.2s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes draw {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.18; transform: scale(0.94); }
      50% { opacity: 0.42; transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .neon-trace,
      .ambient-glow { animation: none; }
    }
  </style>
  <defs>
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur-small" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur-large" />
      <feMerge>
        <feMergeNode in="blur-large" />
        <feMergeNode in="blur-small" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="background-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </radialGradient>
    <!-- The complete Modique mark is split into two paths for a seamless chase. -->
    <path
      id="modique-mark-outer"
      d="M 110 180 H 219 V 126 Q 219 114 231 114 H 276 V 69 H 357 L 546 231 L 294 84 V 170 Q 294 180 284 180 H 229 V 225 Q 229 236 218 236 H 129 Q 119 236 119 226 V 192 Q 119 180 110 180 Z"
      pathLength="100"
    />
    <path
      id="modique-mark-inner"
      d="M 294 84 L 546 231 M 219 180 V 126 Q 219 114 231 114 H 276 V 69 H 357 L 546 231"
      pathLength="100"
    />
  </defs>
  <rect width="900" height="300" fill="var(--ink)" />
  <ellipse class="ambient-glow" cx="450" cy="150" rx="260" ry="150" fill="url(#background-glow)" />
  <g transform="translate(450 150) scale(0.68) translate(-328 -150)">
    <use href="#modique-mark-outer" class="base-trace" />
    <use href="#modique-mark-inner" class="base-trace" />
    <use href="#modique-mark-outer" class="neon-trace" />
    <use href="#modique-mark-inner" class="neon-trace neon-trace--delayed" />
  </g>
</svg>
